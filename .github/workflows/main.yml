```yaml
name: SSH_Ubuntu_Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and configure SSH
        shell: bash
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server ufw

          # Create a dedicated SSH user
          if ! id sshuser >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash sshuser
          fi

          # Set password from GitHub Secret
          if [ -z "${SSH_PASSWORD:-}" ]; then
            echo "::error::SSH_PASSWORD secret is missing."
            exit 1
          fi

          printf 'sshuser:%s\n' "$SSH_PASSWORD" | sudo chpasswd
          unset SSH_PASSWORD

          # Configure SSH to use password authentication
          sudo tee /etc/ssh/sshd_config.d/99-github-runner.conf >/dev/null <<'EOF'
          Port 22
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers sshuser
          EOF

          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-ssh-${{ github.run_id }}

      - name: Configure firewall and verify SSH
        shell: bash
        run: |
          set -euo pipefail

          sudo ufw --force reset
          sudo ufw default deny incoming
          sudo ufw default allow outgoing
          sudo ufw allow in on tailscale0 to any port 22 proto tcp
          sudo ufw --force enable

          sudo systemctl restart ssh
          sleep 2

          if ! sudo systemctl is-active --quiet ssh; then
            sudo systemctl status ssh --no-pager || true
            echo "::error::SSH service is not active."
            exit 1
          fi

          if ! timeout 5 bash -c '</dev/tcp/127.0.0.1/22'; then
            echo "::error::SSH port 22 is not listening."
            exit 1
          fi

          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "::error::Could not obtain Tailscale IPv4."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Keep SSH server running
        shell: bash
        run: |
          echo "======================================"
          echo " Temporary Ubuntu SSH Server"
          echo "======================================"
          echo "Tailscale IP: ${TAILSCALE_IP}"
          echo "SSH Port    : 22"
          echo "Username    : sshuser"
          echo "Password    : GitHub secret SSH_PASSWORD"
          echo "Connect via the same Tailscale network."
          echo "======================================"

          while true; do
            sleep 300
          done
```
