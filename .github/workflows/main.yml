
name: Arch_Linux_SSH_Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-ssh-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  arch-ssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-arch-ssh-${{ github.run_id }}

      - name: Validate configuration and start Arch SSH
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail

          # Check required secret without displaying its value.
          if [[ -z "${SSH_PUBLIC_KEY:-}" ]]; then
            echo "::error::SSH_PUBLIC_KEY secret is missing."
            exit 1
          fi

          # Validate the public key using OpenSSH tools.
          KEY_FILE="$(mktemp)"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%s\n' "$SSH_PUBLIC_KEY" > "$KEY_FILE"

          if ! ssh-keygen -l -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::SSH_PUBLIC_KEY is not a valid SSH public key."
            exit 1
          fi

          # Obtain the Tailscale IPv4 address.
          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [[ -z "$TS_IP" ]]; then
            echo "::error::Could not obtain Tailscale IPv4."
            exit 1
          fi

          # Ensure Docker is available.
          docker info >/dev/null

          # Start the official Arch Linux container.
          docker pull archlinux:latest

          docker rm -f arch-ssh >/dev/null 2>&1 || true

          docker run -d \
            --name arch-ssh \
            --network host \
            --restart unless-stopped \
            --env TS_IP="$TS_IP" \
            archlinux:latest \
            sleep infinity

          # Initialize Arch Linux package signing keys.
          docker exec arch-ssh bash -lc '
            set -e
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm openssh
          '

          # Install the SSH public key without printing it.
          docker exec arch-ssh install -d \
            -m 700 -o root -g root /root/.ssh

          docker exec -i arch-ssh bash -c \
            'cat > /root/.ssh/authorized_keys' < "$KEY_FILE"

          docker exec arch-ssh chown root:root \
            /root/.ssh/authorized_keys

          docker exec arch-ssh chmod 600 \
            /root/.ssh/authorized_keys

          # Bind SSH only to the Tailscale address.
          docker exec -e TS_IP="$TS_IP" arch-ssh bash -lc '
            set -e

            install -d -m 755 /run/sshd
            ssh-keygen -A

            cat > /etc/ssh/sshd_config <<EOF
          Port 22
          AddressFamily inet
          ListenAddress ${TS_IP}
          HostKey /etc/ssh/ssh_host_ed25519_key
          PermitRootLogin prohibit-password
          PubkeyAuthentication yes
          AuthenticationMethods publickey
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          AllowUsers root
          PermitEmptyPasswords no
          X11Forwarding no
          PrintMotd no
          EOF

            chmod 600 /etc/ssh/sshd_config
            /usr/bin/sshd -t
          '

          # Launch sshd in the running container.
          docker exec -d arch-ssh /usr/bin/sshd -D -e

          # Wait for SSH to listen on the Tailscale IP.
          READY=0

          for attempt in $(seq 1 20); do
            if timeout 2 bash -c \
              'exec 3<>/dev/tcp/$1/22' _ "$TS_IP" \
              2>/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::SSH did not become ready."
            docker logs --tail 50 arch-ssh || true
            exit 1
          fi

          # Print connection details only.
          {
            echo "TAILSCALE_IP=$TS_IP"
          } >> "$GITHUB_ENV"

      - name: Arch SSH Ready
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " Arch Linux SSH Server Ready"
          echo "======================================"
          echo "Host     : ${TAILSCALE_IP}"
          echo "Port     : 22"
          echo "Username : root"
          echo "Auth     : SSH public key only"
          echo "OS       : Arch Linux container"
          echo "======================================"

          while true; do
            sleep 300
          done

      - name: Remove Arch container
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm -f arch-ssh >/dev/null 2>&1 || true
