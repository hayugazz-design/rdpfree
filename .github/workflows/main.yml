
name: RDP_Ubuntu_XFCE_Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdp-xfce-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  secure-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install XFCE and xRDP
        shell: bash
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${RDP_PASSWORD:-}" ]]; then
            echo "::error::RDP_PASSWORD secret is missing."
            exit 1
          fi

          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            dbus-daemon \
            ufw

          if ! id rdp >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash rdp
          fi

          printf 'rdp:%s\n' "$RDP_PASSWORD" | sudo chpasswd
          unset RDP_PASSWORD

          # Start XFCE instead of KDE Plasma.
          printf '%s\n' \
            '#!/bin/sh' \
            'exec startxfce4' \
            | sudo tee /home/rdp/.xsession >/dev/null

          sudo chown rdp:rdp /home/rdp/.xsession
          sudo chmod 700 /home/rdp/.xsession

          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --hostname=gh-xfce-${{ github.run_id }}

      - name: Configure firewall and verify xRDP
        shell: bash
        run: |
          set -euo pipefail

          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [[ -z "$TS_IP" ]]; then
            echo "::error::Tailscale IP unavailable."
            exit 1
          fi

          # Permit RDP only through the Tailscale interface.
          sudo ufw default deny incoming
          sudo ufw default allow outgoing
          sudo ufw allow in on tailscale0 \
            to any port 3389 proto tcp
          sudo ufw --force enable

          for i in $(seq 1 30); do
            if timeout 2 bash -c \
              'echo > /dev/tcp/127.0.0.1/3389' \
              2>/dev/null; then
              break
            fi
            sleep 2
          done

          if ! timeout 3 bash -c \
            'echo > /dev/tcp/127.0.0.1/3389' \
            2>/dev/null; then
            echo "::error::xRDP failed to start."
            sudo systemctl --no-pager status xrdp || true
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "XFCE RDP service is ready."

      - name: Maintain temporary session
        shell: bash
        run: |
          set -euo pipefail

          echo "Temporary XFCE desktop is ready."
          echo "Address: $TAILSCALE_IP"
          echo "Username: rdp"
          echo "Password: use GitHub secret RDP_PASSWORD."
          echo "Use a Tailscale-connected client."

          while true; do
            echo "[$(date -u '+%H:%M:%S UTC')] XFCE active"
            sleep 300
          done
