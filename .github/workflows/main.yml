
name: Ubuntu_SSH_Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and Configure SSH Server
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openssh-server ufw

          # Create SSH user
          if ! id sshuser >/dev/null 2>&1; then
            sudo useradd --create-home --shell /bin/bash sshuser
          fi

          # Configure passwordless sudo for sshuser
          echo 'sshuser ALL=(ALL:ALL) NOPASSWD:ALL' \
            | sudo tee /etc/sudoers.d/sshuser >/dev/null

          sudo chown root:root /etc/sudoers.d/sshuser
          sudo chmod 440 /etc/sudoers.d/sshuser
          sudo visudo -cf /etc/sudoers.d/sshuser

          # Verify sudo configuration before starting SSH
          sudo -n -l -U sshuser
          sudo -u sshuser sudo -n whoami

          # Prepare SSH runtime directory
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd

          # Prepare SSH directory
          sudo install -d \
            -m 700 \
            -o sshuser \
            -g sshuser \
            /home/sshuser/.ssh

          # SSH public-key authentication only
          sudo tee /etc/ssh/sshd_config.d/99-github-runner.conf >/dev/null <<'EOF'
          Port 22
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AllowUsers sshuser
          EOF

          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-ssh-${{ github.run_id }}

      - name: Configure SSH Key and Firewall
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PUBLIC_KEY:-}" ]; then
            echo "::error::SSH_PUBLIC_KEY secret is missing."
            exit 1
          fi

          # Validate that the supplied key is an SSH public key
          case "$SSH_PUBLIC_KEY" in
            ssh-ed25519\ *|ssh-rsa\ *|ecdsa-sha2-nistp256\ *)
              ;;
            *)
              echo "::error::SSH_PUBLIC_KEY does not look like a supported public key."
              exit 1
              ;;
          esac

          # Install public key
          printf '%s\n' "$SSH_PUBLIC_KEY" \
            | sudo tee /home/sshuser/.ssh/authorized_keys >/dev/null

          sudo chown sshuser:sshuser \
            /home/sshuser/.ssh/authorized_keys
          sudo chmod 600 \
            /home/sshuser/.ssh/authorized_keys

          # Allow SSH only through Tailscale
          sudo ufw --force reset
          sudo ufw default deny incoming
          sudo ufw default allow outgoing
          sudo ufw allow in on tailscale0 to any port 22 proto tcp
          sudo ufw --force enable

          # Validate SSH configuration
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd
          sudo sshd -t
          sudo systemctl restart ssh
          sleep 2

          if ! sudo systemctl is-active --quiet ssh; then
            sudo systemctl status ssh --no-pager || true
            echo "::error::SSH service is not active."
            exit 1
          fi

          if ! timeout 5 bash -c '</dev/tcp/127.0.0.1/22'; then
            echo "::error::SSH port 22 is not listening."
            sudo journalctl -u ssh --no-pager -n 50 || true
            exit 1
          fi

          # Verify passwordless sudo configuration
          sudo -u sshuser sudo -n whoami

          # Get Tailscale IPv4
          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "::error::Could not obtain Tailscale IPv4."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: SSH Server Ready
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " Ubuntu SSH Server Ready"
          echo "======================================"
          echo "Host     : ${TAILSCALE_IP}"
          echo "Port     : 22"
          echo "Username : sshuser"
          echo "Root     : sudo -i"
          echo "Auth     : SSH public key"
          echo "======================================"

          while true; do
            sleep 300
          done
