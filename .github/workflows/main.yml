
name: Arch_Linux_SSH_Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-ssh-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  arch-ssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-arch-ssh-${{ github.run_id }}

      - name: Validate secrets
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SSH_PUBLIC_KEY:-}" ]]; then
            echo "::error::SSH_PUBLIC_KEY is missing."
            exit 1
          fi

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%s\n' "$SSH_PUBLIC_KEY" > "$KEY_FILE"

          if ! ssh-keygen -lf "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::Invalid SSH public key."
            exit 1
          fi

          echo "SSH public key validated."

      - name: Start Arch Linux container and configure SSH
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          set +x

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%s\n' "$SSH_PUBLIC_KEY" > "$KEY_FILE"
          unset SSH_PUBLIC_KEY

          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [[ -z "$TS_IP" ]]; then
            echo "::error::Tailscale IPv4 address unavailable."
            exit 1
          fi

          HOST_PORT=2222

          docker info >/dev/null
          docker pull archlinux:latest

          # Remove a stale container from a previous attempt.
          docker rm -f arch-ssh >/dev/null 2>&1 || true

          # Publish host port 2222 to container port 22.
          # Bind only to the runner's Tailscale IPv4 address.
          docker run -d \
            --name arch-ssh \
            --publish "${TS_IP}:${HOST_PORT}:22" \
            --restart unless-stopped \
            archlinux:latest \
            sleep infinity

          # Initialize Arch keyring and install OpenSSH.
          docker exec arch-ssh bash -lc '
            set -e
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm openssh
          '

          # Install authorized public key for root.
          docker exec arch-ssh install -d \
            -m 700 -o root -g root /root/.ssh

          docker exec -i arch-ssh \
            bash -c 'cat > /root/.ssh/authorized_keys' \
            < "$KEY_FILE"

          docker exec arch-ssh chown root:root \
            /root/.ssh/authorized_keys

          docker exec arch-ssh chmod 600 \
            /root/.ssh/authorized_keys

          # Configure SSH with public-key authentication only.
          docker exec arch-ssh bash -lc '
            set -e

            install -d -m 755 /run/sshd
            ssh-keygen -A

            cat > /etc/ssh/sshd_config <<EOF
          Port 22
          AddressFamily inet
          ListenAddress 0.0.0.0
          HostKey /etc/ssh/ssh_host_ed25519_key
          PermitRootLogin prohibit-password
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AuthenticationMethods publickey
          PermitEmptyPasswords no
          AllowUsers root
          UsePAM no
          X11Forwarding no
          AllowTcpForwarding no
          PermitTunnel no
          PrintMotd no
          EOF

            chmod 600 /etc/ssh/sshd_config
            /usr/bin/sshd -t
          '

          # Start SSH daemon inside the container.
          docker exec -d arch-ssh /usr/bin/sshd -D -e

          # Wait for SSH to listen on the published host port.
          READY=0

          for attempt in $(seq 1 30); do
            if timeout 2 bash -c \
              'exec 3<>/dev/tcp/$1/$2' _ "$TS_IP" "$HOST_PORT" \
              2>/dev/null; then
              READY=1
              break
            fi

            sleep 2
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::SSH port ${HOST_PORT} did not become available."
            docker logs --tail 80 arch-ssh || true
            exit 1
          fi

          {
            echo "TAILSCALE_IP=$TS_IP"
            echo "SSH_HOST_PORT=$HOST_PORT"
          } >> "$GITHUB_ENV"

          echo "Arch SSH setup completed."

      - name: Verify SSH server
        shell: bash
        run: |
          set -euo pipefail

          docker exec arch-ssh bash -lc '
            echo "OS:"
            cat /etc/os-release | head -n 3

            echo
            echo "SSH configuration:"
            /usr/bin/sshd -t

            echo
            echo "SSH process:"
            pgrep -a sshd
          '

          echo "Tailscale IP: ${TAILSCALE_IP}"
          echo "SSH port: ${SSH_HOST_PORT}"
          echo "Login user: root"
          echo "Authentication: SSH public key only"

      - name: Arch SSH Ready
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " Arch Linux SSH Server Ready"
          echo "======================================"
          echo "Host     : ${TAILSCALE_IP}"
          echo "Port     : ${SSH_HOST_PORT}"
          echo "Username : root"
          echo "Auth     : Public key only"
          echo "OS       : Arch Linux container"
          echo "======================================"

          while true; do
            sleep 300
          done

      - name: Cleanup Arch container
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm -f arch-ssh >/dev/null 2>&1 || true
